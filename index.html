
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Personal Expense Manager</h1>
        <p>Track your spending, manage your money.</p>
    </header>

    <main class="container">
        <section class="summary">
            <p>Total Spending</p>
            <h2 id="totalAmount">₹0.00</h2>
            <p id="expenseCount">0 expenses recorded</p>
        </section>

        <section class="form-section">
            <h2 id="formHeading">Add New Expense</h2>

            <form id="expenseForm">
                <label for="title">Expense Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="e.g. Groceries"
                    required
                >

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="e.g. 250"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">
                        Add Expense
                    </button>
                    <button
                        type="button"
                        id="cancelBtn"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="expenses-section">
            <h2>Your Expenses</h2>

            <p id="emptyMessage">No expenses yet. Add your first one!</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList"></tbody>
                </table>
            </div>

            <button type="button" id="clearBtn" class="clear-btn">
                Clear All Expenses
            </button>
        </section>
    </main>

    <footer>
        <p>Cook N Klean | Web Development Internship — Week 2</p>
    </footer>
</body>
</html>
